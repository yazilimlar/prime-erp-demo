# Render Blueprint — Prime Industrial ERP read-only demo API (free tier).
services:
  - type: web
    name: prime-erp-demo
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    # DB is read-only; demo_db.ensure_seeded() copies the sanitized seed DB
    # into ./data on first boot, so no persistent disk is needed.
    startCommand: gunicorn demo_server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEMO_MODE
        value: "1"
      - key: ERP_COOKIE_SECURE
        value: "1"
